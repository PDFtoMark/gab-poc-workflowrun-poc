name: Listener
on:
  workflow_run:
    workflows: ['Trigger One']
    types: [completed]
permissions:
  actions: read
  pull-requests: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Dump run metadata
        run: |
          echo "run_name=${{ github.event.workflow_run.name }}"
          echo "run_event=${{ github.event.workflow_run.event }}"
          echo "run_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "run_actor=${{ github.event.workflow_run.actor.login }}"
          echo "run_id=${{ github.event.workflow_run.id }}"
      - name: Download attacker artifact from triggering run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr-context
          path: ./context
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Show artifact contents
        run: |
          ls -la ./context || true
          cat ./context/pr-number || echo NOFILE
